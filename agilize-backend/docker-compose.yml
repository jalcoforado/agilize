version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agilize_postgres
    environment:
      POSTGRES_DB: agilize_db
      POSTGRES_USER: agilize_user
      POSTGRES_PASSWORD: agilize123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agilize_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agilize_user -d agilize_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agilize_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agilize_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agilize_backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=agilize_user
      - DB_PASSWORD=agilize123
      - DB_NAME=agilize_db
      - REDIS_HOST=redis
      - PORT=3000
      - NODE_ENV=development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - agilize_network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  agilize_network:
    driver: bridge
