version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agilize_postgres
    environment:
      POSTGRES_DB: agilize_db
      POSTGRES_USER: agilize_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agilize_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agilize_user -d agilize_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # Modo dev: usa o stage "deps" (todas as dependências, incl. tsx).
      # A imagem "runtime" (produção) só tem deps de produção e roda dist/.
      target: deps
    container_name: agilize_backend
    env_file: .env
    environment:
      # Sobrescreve apenas o que é diferente dentro do Docker
      - DB_HOST=postgres
      - NODE_ENV=development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - agilize_network
    command: npm run dev

volumes:
  postgres_data:

networks:
  agilize_network:
    driver: bridge
